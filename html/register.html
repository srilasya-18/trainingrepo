<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .form-box{
            width: 400px;
            margin: 30px auto;
            background-color: white;
            padding: 20px;
        }

        input{
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        button{
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="form-box">

    <h1>Resident Registration</h1>

    <form>

        Full Name:<br>
        <input type="text"><br><br>

        Flat / House Number:<br>
        <input type="text"><br><br>

        Email:<br>
        <input type="email"><br><br>

        Mobile Number:<br>
        <input type="tel"><br><br>

        Password:<br>
        <input type="password"><br><br>

        Confirm Password:<br>
        <input type="password"><br><br>

        Resident Type:<br>
        <input type="radio" name="type"> Owner
        <input type="radio" name="type"> Tenant
        <br><br>

        <button>Register</button>

    </form>

</div>

</body>
</html>
