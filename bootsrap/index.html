<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System</title>

    <style>
        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background-color:black;
            overflow:hidden;
        }
        .sun{
            width:100px;
            height:100px;
            background-color:orange;
            border-radius:50%;
            position:absolute;
        }
        .orbit{
            width:300px;
            height:300px;
            border:2px solid white;
            border-radius:50%;
            position:relative;
            animation:rotateOrbit 5s linear infinite;
        }
        .earth{
            width:50px;
            height:50px;
            background-color:deepskyblue;
            border-radius:50%;
            position:absolute;
            top:-25px;
            left:50%;
            transform:translateX(-50%);
        }
        @keyframes rotateOrbit{
            from{
                transform:rotate(0deg);
            }
            to{
                transform:rotate(360deg);
            }
        }
        .moon-orbit{
            width:40px;
            height:40px;
            position:absolute;
            top:-10px;
            left:-10px;
            animation:rotate 2s linear infinite;
        }
        .moon{
            width:6px;
            height:6px;
            background:white;
            border-radius:50%;
            position:absolute;
            top:0;
            left:50%;
            transform:translateX(-50%);
        }
        /* .mercury{
            width:40px;
            height:40px;
            background-color:gray;
            border-radius:50%;
            position:absolute;
            top:-15px;
            left:25%;
            transform:translateX(-25%) scale(-0.6);
        }
        @keyframe rotateOrbit{
            from{
                transform:rotate(0deg);
            }
            to{
                transform:rotate(360deg);
            }
        } */
    </style>
</head>
<body>
    <div class="sun"></div>
    <div class="orbit">
        <!-- <div class="mercury"></div> -->
        <div class="earth">
            <div class="moon-orbit">
                <div class="moon"></div>
            </div>
            </div>
    </div>

</body>
</html>
